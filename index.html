<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Butterfly Pupae Marketplace - LepVision Trade Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet GIS Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    .chat-msg { margin-bottom: 8px; font-size: 14px; }
    .chat-msg.me { text-align: right; color: #047857; }
    .chat-msg .who { font-weight: bold; font-size: 11px; color: #64748b; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Navigation Bar -->
  <nav class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🦋</span>
        <span class="font-bold text-xl tracking-wide">LepVision Butterfly Exchange</span>
      </div>
      <div id="navLinks" class="hidden md:flex space-x-4 items-center">
        <!-- Rendered dynamically based on login state -->
      </div>
    </div>
  </nav>

  <!-- Main Application Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    <div id="appRoot">
      <!-- Dynamic Views Render Here -->
      <div class="flex justify-center items-center py-20">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-700"></div>
        <span class="ml-3 text-slate-600 font-medium">Loading LepVision Marketplace...</span>
      </div>
    </div>
  </main>

  <!-- Floating Chatbot Widget -->
  <div class="fixed bottom-5 right-5 z-50">
    <button id="chatToggle" class="bg-emerald-700 hover:bg-emerald-800 text-white p-3.5 rounded-full shadow-lg flex items-center justify-center transition">
      💬
    </button>
    <div id="chatWindow" class="hidden flex-col bg-white rounded-xl shadow-2xl border border-slate-200 w-80 h-96 absolute bottom-16 right-0 overflow-hidden">
      <div class="bg-emerald-800 text-white p-3 font-bold text-sm flex justify-between items-center">
        <span>Butterfly Assistant (AI)</span>
        <button onclick="toggleChat()" class="text-emerald-200 hover:text-white">&times;</button>
      </div>
      <div id="chatMessages" class="flex-grow p-3 overflow-y-auto bg-slate-50 space-y-2"></div>
      <div class="p-2 border-t border-slate-200 flex bg-white">
        <input type="text" id="chatInput" placeholder="Ask about species, prices, KYC..." class="flex-grow border rounded-l-md px-3 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-emerald-600">
        <button id="chatSend" onclick="sendChat()" class="bg-emerald-700 text-white px-4 py-1.5 rounded-r-md text-sm font-semibold hover:bg-emerald-800">Send</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-100 border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    <p>&copy; 2026 LepVision Marinduque Butterfly Industry Exchange Platform. All rights reserved.</p>
  </footer>

  <!-- Core Client-Side Logic & RPC Engine -->
  <script>
    const $ = id => document.getElementById(id);
    let authToken = localStorage.getItem('lepvision_token') || '';
    let currentState = null;

    // Google Apps Script Web App Endpoint URL (Automatically resolves current deployment URL)
    const APP_URL = window.location.href.split('?')[0];

    async function rpc(fn, ...args) {
      try {
        const res = await fetch(APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ fn, args })
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error);
        return json.result;
      } catch (err) {
        alert('Error: ' + err.message);
        throw err;
      }
    }

    async function loadState() {
      if (!authToken) {
        renderAuthView();
        return;
      }
      try {
        currentState = await rpc('getState', authToken);
        renderAppView();
      } catch (e) {
        localStorage.removeItem('lepvision_token');
        authToken = '';
        renderAuthView();
      }
    }

    // --- VIEW RENDERERS ---

    function renderAuthView() {
      $('navLinks').innerHTML = '';
      $('appRoot').innerHTML = `
        <div class="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-8">
          <div class="text-center mb-6">
            <span class="text-4xl">🦋</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">Welcome to LepVision</h2>
            <p class="text-sm text-slate-500">Marinduque Butterfly Production & Exchange</p>
          </div>
          
          <div id="authError" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-xs rounded-lg"></div>

          <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
            <div id="regFields" class="hidden space-y-4">
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Account Role</label>
                <select id="regRole" class="w-full border rounded-lg p-2.5 text-sm bg-white">
                  <option value="purchaser">Purchaser (Buying from Breeders)</option>
                  <option value="buyer">Buyer / Exporter</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Full Name</label>
                <input type="text" id="regName" class="w-full border rounded-lg p-2.5 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Organization / Farm</label>
                <input type="text" id="regOrg" class="w-full border rounded-lg p-2.5 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Phone Number</label>
                <input type="text" id="regPhone" placeholder="09171234567" class="w-full border rounded-lg p-2.5 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Country</label>
                <input type="text" id="regCountry" value="PH" class="w-full border rounded-lg p-2.5 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Address</label>
                <textarea id="regAddr" rows="2" class="w-full border rounded-lg p-2.5 text-sm"></textarea>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username</label>
              <input type="text" id="authUsername" required class="w-full border rounded-lg p-2.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
              <input type="password" id="authPassword" required class="w-full border rounded-lg p-2.5 text-sm">
            </div>

            <button type="submit" id="authSubmitBtn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg text-sm transition">
              Log In
            </button>
          </form>

          <div class="mt-6 text-center">
            <button onclick="toggleAuthMode()" id="authModeToggle" class="text-xs text-emerald-700 hover:underline font-medium">
              Need an account? Register here
            </button>
          </div>
        </div>
      `;
    }

    let isRegisterMode = false;
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      $('regFields').classList.toggle('hidden', !isRegisterMode);
      $('authSubmitBtn').innerText = isRegisterMode ? 'Register Account' : 'Log In';
      $('authModeToggle').innerText = isRegisterMode ? 'Already have an account? Log In' : 'Need an account? Register here';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const u = $('authUsername').value.trim();
      const p = $('authPassword').value;
      const errBox = $('authError');
      errBox.classList.add('hidden');

      try {
        if (isRegisterMode) {
          const res = await rpc('login', $('regRole').value, u, p, {
            mode: 'register',
            name: $('regName').value,
            org: $('regOrg').value,
            phone: $('regPhone').value,
            country: $('regCountry').value,
            addr: $('regAddr').value
          });
          if (!res.ok) throw new Error(res.msg);
          authToken = res.token;
        } else {
          const res = await rpc('login', 'purchaser', u, p, { mode: 'login' });
          if (!res.ok) throw new Error(res.msg);
          authToken = res.token;
        }
        localStorage.setItem('lepvision_token', authToken);
        loadState();
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      }
    }

    async function handleLogout() {
      await rpc('logout', authToken);
      authToken = '';
      localStorage.removeItem('lepvision_token');
      loadState();
    }

    function renderAppView() {
      const me = currentState.me;
      $('navLinks').innerHTML = `
        <span class="text-xs bg-emerald-900 px-3 py-1 rounded-full font-medium">Role: ${me.role.toUpperCase()}</span>
        <span class="text-sm font-semibold">${me.org || me.name}</span>
        <button onclick="handleLogout()" class="bg-emerald-700 hover:bg-emerald-900 px-3 py-1.5 rounded-md text-xs font-semibold">Logout</button>
      `;

      if (me.kyc !== 'verified') {
        renderKycNotice(me);
        return;
      }

      // Render Marketplace or Dashboard based on role
      $('appRoot').innerHTML = `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
              <h1 class="text-xl font-bold text-slate-900">Welcome, ${me.name}</h1>
              <p class="text-xs text-slate-500">Accredited ${me.role} dashboard & live trading exchange.</p>
            </div>
            <div class="text-right text-xs text-slate-600">
              <p>USD Rate: ₱${currentState.rate}</p>
              <p class="font-semibold text-emerald-700">Status: Verified Breeder / Trader</p>
            </div>
          </div>

          <!-- Active Catalog / Lots Section -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Available Butterfly Pupae Catalog</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="catalogGrid">
              ${currentState.catalog.length === 0 ? '<p class="text-xs text-slate-500 col-span-full">No active pupae lots available right now.</p>' : ''}
              ${currentState.catalog.map(l => `
                <div class="border rounded-lg p-4 flex flex-col justify-between bg-slate-50">
                  <div>
                    <h3 class="font-bold text-emerald-800">${l.sp.replace('Butterfly-', '')}</h3>
                    <p class="text-xs text-slate-600">Supplier: ${l.ownerOrg}</p>
                    <p class="text-sm font-extrabold mt-2">₱${l.price} / pupa</p>
                    <p class="text-xs text-slate-500 mt-1">Available Stock: ${l.left} units</p>
                  </div>
                  <button onclick="placeOrderPrompt('${l.id}', ${l.left}, ${l.price})" class="mt-4 bg-emerald-700 hover:bg-emerald-800 text-white py-1.5 rounded-md text-xs font-semibold">
                    Place Order
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderKycNotice(me) {
      $('appRoot').innerHTML = `
        <div class="max-w-xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-8 text-center space-y-4">
          <span class="text-4xl">⏳</span>
          <h2 class="text-xl font-bold text-slate-900">KYC Verification Required</h2>
          <p class="text-sm text-slate-600">Your account (${me.role}) is currently awaiting document verification before you can participate in pupae exchange.</p>
          <div class="p-4 bg-amber-50 text-amber-800 text-xs rounded-lg text-left">
            <p class="font-bold mb-1">Required Documents:</p>
            <ul class="list-disc pl-4 space-y-1">
              ${me.role === 'breeder' ? '<li>Government ID</li><li>DENR / Farm Permit</li>' : ''}
              ${me.role === 'purchaser' ? '<li>Government ID</li><li>Business License</li>' : ''}
              ${me.role === 'buyer' ? '<li>Government ID</li>' : ''}
            </ul>
          </div>
          <button onclick="handleLogout()" class="mt-4 bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-xs font-semibold text-slate-700">Sign Out</button>
        </div>
      `;
    }

    async function placeOrderPrompt(listingId, maxQty, price) {
      const q = prompt(`Enter quantity to order (Max ${maxQty}):`, '10');
      if (!q) return;
      const qty = parseInt(q, 10);
      if (isNaN(qty) || qty <= 0 || qty > maxQty) {
        alert('Invalid quantity.');
        return;
      }
      try {
        const orderId = await rpc('placeOrder', authToken, listingId, qty, { payMethod: 'GCash' });
        alert('Order successfully placed! Order ID: ' + orderId);
        loadState();
      } catch (err) {
        alert('Failed to place order: ' + err.message);
      }
    }

    // --- CHATBOT WIDGET LOGIC ---
    let chatBusy = false;

    function toggleChat() {
      const w = $('chatWindow');
      const open = w.style.display === 'flex';
      w.style.display = open ? 'none' : 'flex';
      if (!open) setTimeout(() => $('chatInput').focus(), 0);
    }

    function addMessage(sender, msg, mine) {
      const div = document.createElement('div');
      div.className = 'chat-msg' + (mine ? ' me' : '');
      div.innerHTML = `<div class="who">${sender}:</div><div>${msg}</div>`;
      const box = $('chatMessages');
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function sendChat() {
      if (chatBusy) return;
      const input = $('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      addMessage('Visitor', msg, true);
      const pending = addMessage('Butterfly Assistant', '…');
      chatBusy = true;
      $('chatSend').disabled = true;
      try {
        const reply = await rpc('chatbotReply', msg);
        pending.lastChild.textContent = String(reply || 'Sorry, I have no answer for that.');
      } catch (e) {
        pending.lastChild.textContent = 'Sorry, the assistant is unavailable right now.';
      } finally {
        chatBusy = false;
        $('chatSend').disabled = false;
        input.focus();
      }
    }

    $('chatToggle').addEventListener('click', toggleChat);
    $('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

    // Initial boot
    addMessage('Butterfly Assistant', 'Hi! Ask me about species, prices, or how to order.');
    loadState();
  </script>
</body>
</html>
